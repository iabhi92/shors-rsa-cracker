name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: this workflow only reads the repo and reports checks — no job
# needs write access to contents, PRs, or packages, so the default GITHUB_TOKEN (which
# otherwise gets broad repo write scope) is explicitly narrowed here rather than left implicit.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r backend/requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy .

      - name: Pytest
        run: pytest -q

      - name: pip-audit (dependency vulnerability scan)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt
