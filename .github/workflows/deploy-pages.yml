name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright chromium
        working-directory: frontend
        # Only for the prerender step below (a real headless browser, not a jsdom stand-in --
        # see scripts/prerender.mjs for why). --with-deps is skipped when the cache already has
        # the browser binary; the OS-level shared libraries it installs alongside are already
        # present on every run of the same runner image regardless of cache state.
        run: npx playwright install chromium ${{ steps.playwright-cache.outputs.cache-hit != 'true' && '--with-deps' || '' }}

      - name: Build
        working-directory: frontend
        # VITE_API_BASE_URL points the static site at the live Render backend (see
        # render.yaml) -- set as a repo Actions variable (Settings > Secrets and variables >
        # Actions > Variables) to https://shors-rsa-cracker.onrender.com/api, the service's
        # actual URL. VITE_BASE_PATH is "/" (the default, so unset) now that the site is
        # served from a custom domain at the root (frontend/public/CNAME) rather than
        # GitHub's /shors-rsa-cracker/ project-site subpath.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://shors-rsa-cracker.onrender.com/api' }}
        run: npm run build

      - name: Prerender static routes
        working-directory: frontend
        # GitHub Pages has no server-side rewrites or custom status codes -- without this, every
        # route except / only exists via the 404.html SPA-fallback trick below, which real
        # browsers happily ignore (they already have the HTML+JS and route client-side) but
        # which Google's URL Inspection tool takes at face value: it reported /guide as
        # "Page cannot be indexed: Not found (404)" even though the page works fine for a human.
        # This visits every route in the sitemap with a real headless browser post-build and
        # saves the rendered result as a real file, so GitHub Pages serves it with a normal 200
        # instead of falling back. See scripts/prerender.mjs for the full explanation.
        run: node scripts/prerender.mjs

      - name: SPA fallback for client-side routing
        # Covers what prerender.mjs doesn't -- dynamic routes like /docs/:slug, which aren't in
        # sitemap.xml since their slugs come from the backend at runtime, not from a fixed list
        # this build step could know about. Deep-linking one still needs 404.html's fallback to
        # load the app shell and hand off to React Router client-side (see the prerender step
        # above for why that fallback alone isn't enough for the routes it *does* cover).
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
