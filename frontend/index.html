<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="From-scratch RSA, classical factoring attacks, a real quantum simulator, and a live IBM quantum hardware run -- an interactive demonstration of why quantum computing breaks RSA."
    />
    <meta name="theme-color" content="#070A0F" />
    <link rel="canonical" href="https://crackrsa.com/" />
    <!--
      Layout.tsx's usePageMeta-equivalent effect overwrites title/og:*/canonical on every route
      change (this is a client-rendered SPA with one static index.html) -- these are the
      site-wide defaults search engines and link unfurlers see before that JS runs, and the
      fallback for any path it doesn't recognize.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shor's Lab" />
    <meta property="og:title" content="Shor's Algorithm vs. RSA" />
    <meta
      property="og:description"
      content="From-scratch RSA, classical factoring attacks, a real quantum simulator, and a live IBM quantum hardware run -- an interactive demonstration of why quantum computing breaks RSA."
    />
    <meta property="og:url" content="https://crackrsa.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shor's Algorithm vs. RSA" />
    <meta
      name="twitter:description"
      content="From-scratch RSA, classical factoring attacks, a real quantum simulator, and a live IBM quantum hardware run -- an interactive demonstration of why quantum computing breaks RSA."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Shor's Lab",
        "alternateName": "Shor's Algorithm vs. RSA",
        "url": "https://crackrsa.com/",
        "description": "An interactive, from-scratch demonstration of RSA encryption, classical factoring attacks, quantum period-finding via Shor's algorithm, and a real IBM quantum hardware run.",
        "about": [
          { "@type": "Thing", "name": "RSA encryption" },
          { "@type": "Thing", "name": "Shor's algorithm" },
          { "@type": "Thing", "name": "Quantum computing" },
          { "@type": "Thing", "name": "Cryptography" }
        ]
      }
    </script>
    <!--
      The backend's own security_headers.py locks its JSON API down to default-src 'none' --
      the pages a person actually browses had no equivalent. A meta-tag CSP can't set every
      directive a real header can (no frame-ancestors, no report-uri), but script-src/style-src/
      connect-src here are exactly the ones that matter for limiting an XSS payload's blast
      radius, so this is real defense in depth, not a formality: script-src 'self' means an
      injected inline <script> or a compromised third-party origin can't execute even if some
      future XSS bug got a payload onto the page. Every origin listed is one this app genuinely
      loads from -- Google Fonts (the stylesheet + the font files it references) and 'self' for
      everything else. connect-src also lists the deployed Render backend
      (https://shors-rsa-cracker.onrender.com) alongside 'self': the Docker/local-dev setup calls
      the backend same-origin via /api, but the GitHub Pages deployment is static-only and calls
      a different origin entirely (see render.yaml, api/client.ts's VITE_API_BASE_URL) -- without
      this, the browser silently blocks every API request as a CSP violation before it's even
      sent, which looks identical to the backend being down but has nothing to do with it.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://shors-rsa-cracker.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <title>Shor's Algorithm vs. RSA</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Loaded as a plain, unbundled static file rather than imported by app code: this
      project's build toolchain (Vite 8 / rolldown) corrupts KaTeX's tokenizer regex when it
      passes through the bundler -- constant-folding katex's piecewise string concatenation of
      lone UTF-16 surrogate escapes (\uD800-\uDBFF) into a single literal, then emitting that
      literal as raw (UTF-8-invalid) bytes instead of \u-escaping them, which get silently
      replaced with U+FFFD on save/serve. The effect: any multi-letter LaTeX command (\bmod,
      \alpha, \text, ...) renders as a red parse-error glyph followed by leftover plain-text
      letters, in both dev and the production build. Loading the untouched, unminified-by-us
      dist file directly (see vite.config.ts's `katex` alias, which points react-katex at
      `window.katex` instead of a bundled copy) sidesteps the bundler entirely and was verified
      byte-for-byte to render correctly.
    -->
    <script src="/katex.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
