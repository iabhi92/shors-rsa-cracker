server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend container (see docker-compose.yml's service name).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: client-side routing (React Router) needs every unknown path to still
    # serve index.html rather than a raw 404 from nginx.
    location / {
        try_files $uri /index.html;
    }
}
