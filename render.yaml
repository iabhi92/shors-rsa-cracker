# Deployed manually via Render's "New Web Service" form (not this file's Blueprint auto-detect
# path), so this is kept as accurate documentation of the actual config rather than a live
# Blueprint -- live at https://shors-rsa-cracker.onrender.com.
services:
  - type: web
    name: shors-rsa-cracker
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ALLOW_ORIGINS
        # The frontend moved to a custom domain (see frontend/public/CNAME); the old
        # iabhi92.github.io URL is kept here too since GitHub Pages 301-redirects it rather
        # than retiring it, so a cached/bookmarked link there still needs to work.
        value: https://iabhi92.github.io,https://crackrsa.com,https://www.crackrsa.com
      - key: PYTHON_VERSION
        value: 3.12.13
